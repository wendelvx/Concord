version: '3.8'

services:
  # Serviço MySQL
  db:
    image: mysql:8.0
    container_name: minicord_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: minicord_user
      MYSQL_PASSWORD: minicord_password
      MYSQL_DATABASE: minicord_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - minicord_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Serviço Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minicord_backend
    environment:
      PORT: 3001
      DB_HOST: db
      DB_USER: minicord_user
      DB_PASS: minicord_password
      DB_NAME: minicord_db
      DB_PORT: 3306
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./src:/app/src
    networks:
      - minicord_network
    command: npm start

  # Serviço Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minicord_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - backend
    networks:
      - minicord_network

volumes:
  mysql_data:

networks:
  minicord_network:
    driver: bridge
